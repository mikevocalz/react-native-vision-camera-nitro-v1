buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:9.2.1"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/VisionCamera+autolinking.gradle'
apply from: "./fix-prefab.gradle"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["VisionCamera_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["VisionCamera_" + name]).toInteger()
}

android {
  namespace "com.margelo.nitro.camera"

  /*
    This package declares no `codegenConfig`, so React Native's gradle plugin
    generates React's OWN core view-manager delegates and module specs into
    this module and compiles them in. This library is Nitro-based and
    references none of them (verified: no source here imports
    com.facebook.react.viewmanagers or com.facebook.fbreact.specs), but every
    library in that position ships a copy — and two of them make the app's
    dex merge fail outright with "Type ... is defined multiple times".
    react-android supplies these classes at runtime; a library must not.
  */
  sourceSets {
    main {
      java {
        exclude 'com/facebook/react/viewmanagers/**'
        exclude 'com/facebook/fbreact/specs/**'
      }
    }
  }

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
            "META-INF",
            "META-INF/**",
            "**/libc++_shared.so",
            "**/libNitroModules.so",
            "**/libfbjni.so",
            "**/libjsi.so",
            "**/libfolly_json.so",
            "**/libfolly_runtime.so",
            "**/libglog.so",
            "**/libhermes.so",
            "**/libhermes-executor-debug.so",
            "**/libhermes_executor.so",
            "**/libreactnative.so",
            "**/libreactnativejni.so",
            "**/libturbomodulejsijni.so",
            "**/libreact_nativemodule_core.so",
            "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
    prefabPublishing true
  }

  prefab {
    VisionCamera {
      headers "${project.buildDir}/headers/visioncamera/"
    }
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          // React Codegen files
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  compileOnly "com.facebook.react:react-native:+"

  // Declared explicitly because the line above is compileOnly here (it is
  // `implementation` upstream, which duplicated React classes in this app).
  // compileOnly drops React's TRANSITIVE androidx from the compile classpath,
  // and this module's Kotlin needs two of them by name: core-ktx supplies the
  // `SharedPreferences.edit { }` extension in HybridCameraDeviceFactory, and
  // lifecycle-common 2.6+ declares `LifecycleOwner.lifecycle` as a val, which
  // is what CustomLifecycle overrides. Without these the module fails to
  // compile with "Unresolved reference 'edit'" and "'lifecycle' overrides
  // nothing".
  implementation "androidx.core:core-ktx:1.15.0"
  implementation "androidx.lifecycle:lifecycle-common:2.8.7"

  // CameraX dependency
  def camerax_version = "1.7.0-alpha03"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-camera2-pipe:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-video:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation "androidx.camera:camera-extensions:${camerax_version}"

  // EXIF Interface for editing EXIF in photos
  implementation 'androidx.exifinterface:exifinterface:1.4.2'

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")

  // Add a dependency on NitroImage
  implementation project(":react-native-nitro-image")
}

tasks.register('prepareHeaders', Copy) {
  from fileTree('./src/main/cpp').filter { it.isFile() }
  from fileTree('../cpp/').filter { it.isFile() }
  from fileTree('../nitrogen/generated/android/c++/').filter { it.isFile() }
  from fileTree('../nitrogen/generated/shared/c++/').filter { it.isFile() }
  include "*.hpp"
  into "${project.buildDir}/headers/visioncamera/VisionCamera/"
  includeEmptyDirs = false
}

preBuild.dependsOn(prepareHeaders)
